name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile

      - name: Generate native project
        working-directory: apps/native
        run: bunx expo prebuild --platform android --no-install

      - name: Decode signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release APK
        working-directory: apps/native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the signing secrets the APK is signed with the debug key.
          if [ -f "$RUNNER_TEMP/release-key.jks" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-key.jks"
          fi
          ./gradlew assembleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: YTDownloader 2.0.${{ github.run_number }}
          files: apps/native/android/app/build/outputs/apk/release/app-release.apk
